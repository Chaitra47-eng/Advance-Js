   <br><br>
   <button  type="button"  onclick="showSkills()">show Skills</button>
   <strong id="strongEle">Select the skills</strong>
  

   <script>
    function showSkills(){

        let allSkills = document.getElementsByName("skills");
        let strongEle = document.getElementById("strongEle")
        let skillsArr = []


        for(let i = 0; i < allSkills.length;i++){
            if(allSkills[i].checked){
                console.log(allSkills[i].value)
                skillsArr.push(allSkills[i].value)
              
            }
        }
        console.log(skillsArr.join(","))
        let resEle = skillsArr.join(",")

        strongEle.textcontent = resEle
        
      
    }
   </script>
