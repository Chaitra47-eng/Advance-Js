    <script>
        let adddata = ()=>{
            let userResponse = confirm("DO YOU WANT TO CONTINUE")
            let userName = prompt("Enter the username u want to store")
            let Age = +prompt("Enter the age")
            //console.log(userResponse)

        if(userResponse){
            //ADD the data in local storage if condition is true
            //localStorage.setItem("username","Chaitra")

            console.log("DATA ADDED SUCCESSFULLY")

        }
    }

    function removeData(){

        }
    }
